<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081425">
  <title>Fuhrpark Cockpit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <div><small>MEIN FUHRPARK</small><h1>Fuhrpark Cockpit</h1></div>
  <button id="logout" class="ghost hidden">Abmelden</button>
</header>
<main>
  <section id="setup" class="panel hidden">
    <h2>Einmalige Einrichtung auf diesem Gerät</h2>
    <p>URL und Publishable/Anon Key werden nur im Browser dieses Geräts gespeichert.</p>
    <label>Supabase URL<input id="sbUrl" placeholder="https://….supabase.co"></label>
    <label>Publishable / Anon Key<input id="sbKey" type="password" placeholder="sb_publishable_…"></label>
    <button id="saveSetup">Speichern</button>
  </section>
  <section id="auth" class="panel hidden">
    <h2>Anmelden</h2>
    <p>Mit dem bestehenden Konto anmelden. Fahrzeuge und Ablesungen werden synchronisiert.</p>
    <label>E-Mail<input id="email" type="email" autocomplete="email"></label>
    <label>Passwort<input id="password" type="password" autocomplete="current-password" minlength="6"></label>
    <div class="actions"><button id="login">Anmelden</button><button id="signup" class="secondary">Konto anlegen</button></div>
    <button id="resetConfig" class="link">Supabase-Verbindung dieses Geräts ändern</button>
    <p id="authMsg" class="msg"></p>
  </section>
  <section id="app" class="hidden">
    <div class="toolbar"><span id="sync" class="sync">● bereit</span><button id="addVehicle">+ Fahrzeug</button></div>
    <nav class="tabs"><button class="tab active" data-view="active">Aktiv</button><button class="tab" data-view="archived">Archiv</button></nav>
    <div id="cards" class="cards"></div>
    <section id="readingPanel" class="panel">
      <h2>Neue Ablesung</h2>
      <form id="readingForm">
        <label>Fahrzeug<select id="vehicleSelect" required></select></label>
        <div class="grid2"><label>Datum<input id="readingDate" type="date" required></label><label>Kilometerstand<input id="odometer" type="number" min="0" step="1" inputmode="numeric" required></label></div>
        <label>Notiz<input id="note" maxlength="100" placeholder="optional"></label>
        <button type="submit">Kilometerstand speichern</button>
      </form><p id="saveMsg" class="msg"></p>
    </section>
    <section class="panel"><div class="row"><h2>Verlauf</h2><button id="refresh" class="ghost">Aktualisieren</button></div><div id="history"></div></section>
  </section>
</main>
<dialog id="vehicleDialog"><form id="vehicleForm"><h2 id="dialogTitle">Fahrzeug</h2><input id="editId" type="hidden">
  <label>Fahrzeugbezeichnung<input id="editName" required></label><label>Kurzname<input id="editShort" required></label>
  <div class="grid2"><label>Vertragsbeginn<input id="editStart" type="date" required></label><label>Vertragsende<input id="editEnd" type="date" required></label></div>
  <div class="grid2"><label>Start-Kilometerstand<input id="editStartKm" type="number" min="0" required></label><label>Gesamtkilometer<input id="editTotal" type="number" min="1" required></label></div>
  <div class="grid2"><label>Toleranz km<input id="editTolerance" type="number" min="0" required></label><label>Währung<input value="EUR" disabled></label></div>
<div class="grid2">
  <label>Mehrkosten €/km
    <input id="editOver" type="number" step="0.0001" min="0" required>
  </label>

  <label>Erstattung €/km
    <input id="editUnder" type="number" step="0.0001" min="0" required>
  </label>
</div>

<div class="actions">
  <button type="button" id="cancelVehicle" class="secondary">Abbrechen</button>
  <button type="submit">Speichern</button>
</div>

</form>
</dialog>

<script src="app.js"></script>
<script src="fahrzeug-antrieb-erweiterung-v2.js"></script>
<script src="mehrkilometer-vergleich-v40.js"></script>
<script src="prognose-chart.js"></script>

</body>
</html>
